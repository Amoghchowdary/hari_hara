name: Deploy Harihara V9 to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: harihara-pages-production
  cancel-in-progress: false
jobs:
  build:
    name: Verify and upload production website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packages
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Verify and build root-based website
        run: npm run verify
      - name: Block high-severity production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check compiled favicon, assets and custom domain
        run: |
          test -s dist/index.html
          test -s dist/favicon.ico
          test "$(cat dist/CNAME)" = "www.hariharafabrictionsandconstructions.in"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    name: Publish approved artifact
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        uses: actions/deploy-pages@v4
        id: deployment
